SectionDevice."Headphones" {
    Comment "Headphones"

    ConflictingDevice []

    Value {
        PlaybackPriority 200   # 高于 Speaker：插入耳机时 WP 自动切换到本设备
        # 依附于耳机插孔：未插入时 WP 灰显本设备
        JackControl "Headphone Jack"
        PlaybackPCM "hw:${CardId}"
        PlaybackMixerElem "DAC1"
    }

    EnableSequence [
        # 同上：引脚交给 DAPM，不在此切换 pin switch。
    ]
    DisableSequence [
    ]
}
