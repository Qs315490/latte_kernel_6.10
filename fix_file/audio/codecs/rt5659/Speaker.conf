SectionDevice."Speaker" {
    Comment "Speaker"

    ConflictingDevice []

    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId}"
        PlaybackMixerElem "DAC1"
    }

    EnableSequence [
        # 输出引脚由 DAPM 自动管理；这里不再切 pin switch，
        # 因为 DAPM pin 状态变化会触发 uevent，导致 GNOME 设置崩溃。
        # 两颗 TFA9890 共用同一 I2S，各自放大一个声道。
        # 名字里的 Left/Right 前缀由板级 codec_conf 提供。
        # 功放左右声道归属已在 verb 级 EnableSeq.conf 设置

    ]
    DisableSequence [
    ]
}
