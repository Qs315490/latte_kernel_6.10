SectionDevice."HeadsetMic" {
    Comment "Headset Microphone"

    ConflictingDevice [
        "IntMic"
    ]

    EnableSequence [
        # 开启 Headset Mic（引脚 → IN1P → BST1 → RECMIX → ADC）
        cset "name='Headset Mic Switch' on"

        # BST1 接 IN1P（板级路由 {"IN1P", NULL, "Headset Mic"}），官方 Boost=64
        cset "name='RECMIX1L BST1 Switch' on"
        cset "name='IN1 Boost Volume' 64"

        # 录音混音器输出到 ADC
        cset "name='Stereo1 ADC MIXL ADC1 Switch' on"
        cset "name='Stereo1 ADC MIXR ADC1 Switch' on"

        # ADC 音量（与 IntMic 同源，官方值）
        cset "name='IN Capture Volume' 23"
        cset "name='STO1 ADC Capture Volume' 70"
    ]

    DisableSequence [
        cset "name='Headset Mic Switch' off"
        cset "name='RECMIX1L BST1 Switch' off"
    ]

    Value {
        CapturePriority 200
        # 依附于耳机插孔：未插入时 WP 自动跳过本设备，回落 IntMic
        JackControl "Headset Mic Jack"
        CaptureMixerElem "Headset Mic"
        CaptureVolume "IN Capture Volume"
        CaptureSwitch "Headset Mic Switch"
    }
}
