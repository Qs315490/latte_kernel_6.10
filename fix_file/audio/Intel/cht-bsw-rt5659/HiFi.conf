# 基于早期移植版验证过的 HiFi.conf 结构。
# 设备文件用绝对路径 include —— alsa-lib 的相对路径是相对
# 「实际文件所在目录」解析的，而这些 conf 位于 /codecs/rt5659/ 下。
#
# 注意：不要用 If+Empty 条件 include 来开关设备——对 Define 空串变量
# 的 Empty 判定在不同 alsa-lib 版本上行为不一致（真机上 False 分支仍
# 执行，导致 device management error）。要临时停用某设备，直接注释掉
# 对应的 Include 行即可。
#
# 底部主麦 MAIN=IN3P/BST3（左声道），顶部 Aux 麦=IN4P/BST4（右声道），
# 双麦配置在 SectionVerb 里（见 EnableSeq.conf）。

SectionVerb {
	Include.e.File "/codecs/rt5659/EnableSeq.conf"

	If.Controls {
		Condition {
			Type ControlExists
			Control "name='media0_in Gain 0 Switch'"
		}
		Before.EnableSequence "0"
		True {
			Include.pe.File "/platforms/bytcr/PlatformEnableSeq.conf"
			Include.pd.File "/platforms/bytcr/PlatformDisableSeq.conf"
		}
	}
}

Include.spk.File "/codecs/rt5659/Speaker.conf"
Include.intmic.File "/codecs/rt5659/IntMic.conf"

# 耳机设备待验证后启用（恢复时直接取消注释）：
#Include.hp.File "/codecs/rt5659/HeadPhones.conf"
#Include.hsmic.File "/codecs/rt5659/HeadsetMic.conf"
